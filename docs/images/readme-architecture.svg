<svg xmlns="http://www.w3.org/2000/svg" width="920" height="424" viewBox="0 0 920 424" role="img" aria-labelledby="title description">
  <title id="title">How the local dashboard handles evidence</title>
  <desc id="description">On a local workstation, the browser reads selected completed records and folders through the File API. It validates evidence, evaluates recorded grants, compares baselines and rechecks follow-ups. The browser saves runs, pins and review decisions in origin-scoped local storage. The Python server serves UI assets only over IPv4 loopback.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" viewBox="0 0 8 8" orient="auto-start-reverse">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#775ea9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="918" height="422" rx="19" fill="#f5f3fb" stroke="#d9d2ec" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="47" fill="#211a38" font-size="31" font-weight="730" letter-spacing="-.6">How the local dashboard handles evidence</text>
    <rect x="27" y="67" width="866" height="329" rx="15" fill="#ede8f7" stroke="#beb0d7" stroke-width="1.5"/>
    <text x="45" y="97" fill="#58457c" font-size="15" font-weight="750" letter-spacing="1.6">LOCAL WORKSTATION</text>

    <path d="M288 176h50" stroke="#775ea9" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M580 176h49" stroke="#775ea9" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M460 309v-37" stroke="#775ea9" stroke-width="2" marker-end="url(#arrow)"/>
    <g stroke-width="1.5">
      <rect x="45" y="114" width="243" height="157" rx="11" fill="#fff" stroke="#cfc2e5"/>
      <rect x="338" y="114" width="242" height="157" rx="11" fill="#2b2246" stroke="#5e4885"/>
      <rect x="629" y="114" width="246" height="157" rx="11" fill="#fff" stroke="#cfc2e5"/>
      <rect x="338" y="309" width="242" height="68" rx="11" fill="#fff" stroke="#cfc2e5"/>
    </g>
    <g font-size="22" font-weight="720" letter-spacing="-.3">
      <text x="61" y="151" fill="#211a38">Selected local files</text>
      <text x="354" y="151" fill="#faf8ff">Browser dashboard</text>
      <text x="645" y="151" fill="#211a38">Browser storage</text>
      <text x="354" y="338" fill="#211a38">Python static server</text>
    </g>
    <g fill="#504664" font-size="18">
      <text x="61" y="186">Completed run exports</text>
      <text x="61" y="214">Codex and invoice folders</text>
      <text x="61" y="242">Review packages or cases</text>
      <text x="645" y="186">Saved runs and pins</text>
      <text x="645" y="214">Cases and decisions</text>
      <text x="645" y="242">Scoped to the local origin</text>
      <text x="354" y="361">127.0.0.1 loopback</text>
      <text x="475" y="296" fill="#58457c" font-size="16" font-weight="620">UI assets only</text>
    </g>
    <g fill="#eee6ff" font-size="18">
      <text x="354" y="186">Check selected evidence</text>
      <text x="354" y="214">Evaluate recorded grants</text>
      <text x="354" y="242">Compare and recheck</text>
    </g>
  </g>
</svg>
