<svg xmlns="http://www.w3.org/2000/svg" width="920" height="338" viewBox="0 0 920 338" role="img" aria-labelledby="title description">
  <title id="title">Trace the action back to its grant</title>
  <desc id="description">In a fictional coding run, a repository owner grants authority to a coordinator, who delegates permission to edit one file to a coding agent. The recorded write targets docs/quickstart.md.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#11142a"/>
      <stop offset="1" stop-color="#262045"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#bbb6f0" opacity=".22"/>
    </pattern>
    <clipPath id="frame"><rect width="920" height="338" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="920" height="338" fill="url(#field)"/>
    <path d="M470 0h450v338H470z" fill="#292343"/>
    <path d="M470 0h450v338H470z" fill="url(#grid)"/>
    <path d="M470 0v338" stroke="#6d608e" stroke-opacity=".7"/>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <path d="M42 64h24" stroke="#9ae8dc" stroke-width="4" stroke-linecap="round"/>
    <text x="79" y="70" fill="#b8eae5" font-size="17" font-weight="700" letter-spacing="2">OFFLINE AGENT REVIEW</text>
    <g font-size="46" font-weight="740" letter-spacing="-1.8">
      <text x="40" y="140" fill="#f8f6ff">Trace the action</text>
      <text x="40" y="195" fill="#d9cbff">back to its grant.</text>
    </g>
    <g fill="#ded9f0" font-size="22">
      <text x="42" y="249">Inspect the record behind</text>
      <text x="42" y="279">a completed agent run.</text>
    </g>

    <text x="501" y="43" fill="#dfd5ff" font-size="15" font-weight="700" letter-spacing="1.8">FICTIONAL CODING RUN</text>
    <path d="M518 86v126" stroke="#a595d4" stroke-width="2" fill="none"/>
    <path d="m513 111 5 6 5-6m-10 63 5 6 5-6" stroke="#c7b8f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g fill="#292343" stroke="#c7b8f4" stroke-width="2">
      <circle cx="518" cy="86" r="7"/>
      <circle cx="518" cy="149" r="7"/>
    </g>
    <circle cx="518" cy="212" r="7" fill="#9ae8dc"/>
    <g stroke-width="1">
      <rect x="540" y="62" width="347" height="48" rx="9" fill="#211b38" stroke="#685a90"/>
      <rect x="540" y="125" width="347" height="48" rx="9" fill="#211b38" stroke="#685a90"/>
      <rect x="540" y="188" width="347" height="48" rx="9" fill="#193436" stroke="#4d9389"/>
    </g>
    <g fill="#faf7ff" font-size="19" font-weight="650">
      <text x="556" y="93">Repository owner</text>
      <text x="556" y="156">Coordinator</text>
      <text x="556" y="219">Coding agent</text>
    </g>
    <g fill="#dacbf8" text-anchor="end" font-size="17">
      <text x="871" y="93">Grants authority</text>
      <text x="871" y="156">Delegates one edit</text>
      <text x="871" y="219" fill="#b1f2e5">Writes one file</text>
    </g>
    <path d="M714 236v15" stroke="#83bdb2" stroke-width="2"/>
    <rect x="540" y="251" width="347" height="53" rx="9" fill="#17192c" stroke="#68607f"/>
    <path d="M557 269h12l6 6v12h-18z M569 269v6h6" fill="none" stroke="#9ae8dc" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="586" y="284" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" fill="#edf2fa">docs/quickstart.md</text>
    <text x="872" y="284" text-anchor="end" font-size="16" fill="#b1f2e5">In scope</text>
  </g>
</svg>
