<svg xmlns="http://www.w3.org/2000/svg" width="920" height="310" viewBox="0 0 920 310" role="img" aria-labelledby="title description">
  <title id="title">Three regression verdicts</title>
  <desc id="description">No regression found when invoice runs differ only in call IDs and artifact hashes. Regression detected when a read-only chain records an unexpected export. Needs review when an action references a grant missing from the record.</desc>
  <rect x="1" y="1" width="918" height="308" rx="19" fill="#f5f3fb" stroke="#d9d2ec" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="51" fill="#211a38" font-size="31" font-weight="730" letter-spacing="-.6">Three regression verdicts</text>
    <g stroke-width="1.5">
      <rect x="28" y="76" width="864" height="58" rx="10" fill="#e5f4ee" stroke="#aed4c5"/>
      <rect x="28" y="149" width="864" height="58" rx="10" fill="#f8eaf0" stroke="#e5b9cd"/>
      <rect x="28" y="222" width="864" height="58" rx="10" fill="#faf0d9" stroke="#e1c992"/>
    </g>
    <circle cx="57" cy="105" r="16" fill="#226655"/>
    <circle cx="57" cy="178" r="16" fill="#93355d"/>
    <circle cx="57" cy="251" r="16" fill="#775214"/>
    <path d="m50 105 5 5 8-10m-6 71v8m0 5v.5m-5 61a5 5 0 0 1 10 0c0 3-5 4-5 7m0 5v.5" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-size="22" font-weight="720" letter-spacing="-.3">
      <text x="83" y="112" fill="#15483d">No regression found</text>
      <text x="83" y="185" fill="#702643">Regression detected</text>
      <text x="83" y="258" fill="#61410e">Needs review</text>
    </g>
    <path d="M332 90v30m0 43v30m0 43v30" stroke="#594869" stroke-opacity=".28" stroke-width="1.5"/>
    <g fill="#2b2635" font-size="21">
      <text x="357" y="112">Only call IDs and artifact hashes changed.</text>
      <text x="357" y="185">A read-only chain recorded an unexpected export.</text>
      <text x="357" y="258">An action references a missing grant.</text>
    </g>
  </g>
</svg>
