<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title description">
  <title id="title">From a recorded run to verified closure</title>
  <desc id="description">Import a completed run or review package. Compare actions, permissions and evidence against a pinned baseline. Inspect findings and record a decision. Close the case after a passing follow-up against that same baseline.</desc>
  <rect x="1" y="1" width="918" height="338" rx="19" fill="#f5f3fb" stroke="#d9d2ec" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="28" y="51" fill="#211a38" font-size="31" font-weight="730" letter-spacing="-.6">From a recorded run to verified closure</text>
    <path d="M437 133h43m-8-7 8 7-8 7M696 181v33m-7-8 7 8 7-8M483 262h-43m8-7-8 7 8 7" fill="none" stroke="#7863a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke-width="1.5">
      <rect x="28" y="85" width="409" height="96" rx="12" fill="#fff" stroke="#d8cfee"/>
      <rect x="483" y="85" width="409" height="96" rx="12" fill="#fff" stroke="#d8cfee"/>
      <rect x="483" y="214" width="409" height="96" rx="12" fill="#fff" stroke="#d8cfee"/>
      <rect x="28" y="214" width="409" height="96" rx="12" fill="#e6f5f0" stroke="#a1c8bd"/>
    </g>
    <g fill="#eae2fa">
      <circle cx="63" cy="121" r="19"/>
      <circle cx="518" cy="121" r="19"/>
      <circle cx="518" cy="250" r="19"/>
    </g>
    <circle cx="63" cy="250" r="19" fill="#c9e8de"/>
    <g fill="#4b3280" font-size="20" font-weight="700" text-anchor="middle">
      <text x="63" y="128">1</text>
      <text x="518" y="128">2</text>
      <text x="518" y="257">3</text>
      <text x="63" y="257" fill="#185950">4</text>
    </g>
    <g fill="#211a38" font-size="24" font-weight="700" letter-spacing="-.35">
      <text x="95" y="129">Import records</text>
      <text x="550" y="129">Check the pinned baseline</text>
      <text x="550" y="258">Inspect and decide</text>
      <text x="95" y="258" fill="#153c37">Verify the follow-up</text>
    </g>
    <g fill="#4f4663" font-size="19">
      <text x="95" y="157">Open a run or review package.</text>
      <text x="550" y="157">Compare grants, actions, evidence.</text>
      <text x="550" y="286">Inspect findings. Save a decision.</text>
      <text x="95" y="286" fill="#315e56">Recheck against the same baseline.</text>
    </g>
  </g>
</svg>
