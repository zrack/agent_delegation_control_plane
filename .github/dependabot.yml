version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /integrations/openai-agents
    schedule:
      interval: weekly
    groups:
      pydantic:
        patterns:
          - pydantic
          - pydantic-core
    # openai-agents 0.24.0 requires websockets >=15,<17. Remove this deferral
    # when an SDK upgrade supports 17; then regenerate and test the full lock.
    ignore:
      - dependency-name: websockets
        versions: [">=17,<18"]
  - package-ecosystem: pip
    directory: /scripts/security
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /experiments/sandbox-agent
    schedule:
      interval: weekly
