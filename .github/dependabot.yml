version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /integrations/openai-agents
    schedule:
      interval: weekly
    groups:
      pydantic:
        patterns:
          - pydantic
          - pydantic-core
      # httpx2 pins httpcore2 to its exact version on supported hosts.
      httpx2-transport:
        patterns:
          - httpx2
          - httpcore2
  - package-ecosystem: pip
    directory: /scripts/security
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /experiments/sandbox-agent
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
